##### Terminal / keyboard ######################################################

# Extended keys work on Ubuntu 22.04's tmux 3.2a; CSI-u output needs 3.5+.
set -g extended-keys on
%if #{m/r:^3[.][234]([^0-9].*)?$,#{version}}
# Keep the default xterm encoding on tmux 3.2–3.4.
%else
set -g extended-keys-format csi-u
%endif
set -as terminal-features 'xterm-kitty:extkeys'

# Preserve Shift+Enter for PiG even when the pane has not requested extended keys.
# This requires the outer terminal to send a distinct modified-Enter sequence.
# Forward modifyOtherKeys directly instead of relying on pane key encoding.
bind -n S-Enter if -F '#{==:#{window_name},PiG}' {
    send-keys -l "\033[27;2;13~"
} {
    send-keys S-Enter
}


# Good terminal capabilities.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"

# Mouse support is useful for resizing/selecting when desired.
set -g mouse on


##### General behaviour #######################################################

# Start numbering windows/panes at 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Larger history.
set -g history-limit 100000

# Reduce delay after Escape -- useful with Neovim.
set -sg escape-time 10

# Keep windows around only while they have panes.
set -g remain-on-exit off


##### Appearance ##############################################################

# Simple status bar.
set -g status on
set -g status-position bottom
set -g status-left " #S "
set -g status-right " %H:%M "
set -g status-left-length 40

# Show useful window names.
set -g automatic-rename off

# Pane borders.
set -g pane-border-status off

# Ctrl+b behaves like the normal tmux prefix,
# but first shows a quick cheat sheet.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Ctrl+b = show hints, then behave exactly like a normal tmux prefix.
bind -T root C-b \
    display-message -d 3000 "h/l panes  g lazygit  s shell  z zoom  d detach  c new-window  %/\" split  [ copy  ? help" \; \
    switch-client -T prefix

##### Pane navigation #########################################################

# No prefix required.
#
# Alt+Left / Alt+Right navigate any manually created splits.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R

# Also support Alt+h / Alt+l.
bind -n M-h select-pane -L
bind -n M-l select-pane -R


##### Pane resizing ###########################################################

# Alt+Shift+arrow resizes panes.
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Down  resize-pane -D 3

# Alt+z toggles fullscreen/zoom for the current pane.
bind -n M-z resize-pane -Z


##### Lazygit #################################################################

# Alt+g = large lazygit popup.
bind -n M-g display-popup \
    -E \
    -w 92% \
    -h 92% \
    -d "#{pane_current_path}" \
    "lazygit"


##### Shell ###################################################################

# Alt+s = temporary shell popup in the current project directory.
bind -n M-s display-popup \
    -E \
    -w 85% \
    -h 80% \
    -d "#{pane_current_path}"

##### IDE-style shortcuts ######################################################

# Each application has its own window; selecting a deferred window starts it.
bind -n M-1 select-window -t Code
bind -n M-2 select-window -t PiG
bind -n M-3 select-window -t Git
bind -n M-4 select-window -t Shell
bind -n M-5 select-window -t Ranger

# Alt+Left / Alt+Right navigate any manually created splits.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R

# Block resize-pane
# Keep mouse support, but don't resize panes by dragging borders.
unbind-key -T root MouseDrag1Border
bind-key -n M-MouseDrag1Border resize-pane -M

##### Reload ##################################################################

# Prefix + r reloads the BTIDE configuration, or the normal config if disabled.
bind r if-shell 'test -f "$HOME/.config/btide/tmux.conf"' \
    'source-file ~/.config/btide/tmux.conf' 'source-file ~/.tmux.conf'
